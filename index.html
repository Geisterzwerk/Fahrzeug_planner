<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4b5f3c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fahrzeuge">
  <title>Fahrzeug-Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1 id="title">Planner</h1>
      <a href="#/einstellungen" class="gear" aria-label="Einstellungen">⚙️</a>
    </div>
    <div id="sub" class="sub"></div>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <a href="#/planner" data-r="planner"><i>📅</i>Planner</a>
    <a href="#/fahrzeuge" data-r="fahrzeuge"><i>🚙</i>Fahrzeuge</a>
    <a href="#/schluessel" data-r="schluessel"><i>🔑</i>Schlüssel</a>
    <a href="#/zuege" data-r="zuege"><i>🪖</i>Züge</a>
    <a href="#/kontakte" data-r="kontakte"><i>👤</i>Kontakte</a>
  </nav>

  <div id="sheet-bg"></div>
  <section id="sheet" aria-modal="true" role="dialog">
    <div class="sheet-head">
      <button id="sheet-back" class="link">Schliessen</button>
      <b id="sheet-title"></b>
      <span></span>
    </div>
    <div id="sheet-body"></div>
  </section>

  <div id="toast"></div>
  <noscript>Bitte JavaScript aktivieren.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
